name: Build MacoraOne

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl

      - name: Compile Linux executable
        run: make clean all

      - name: Validate executable
        run: |
          ./one --version
          ./one --help
          make test

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: macoraone-linux-x86_64
          path: one
