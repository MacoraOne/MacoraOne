name: Build gs_log module
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zip
      - name: Build and test
        run: |
          set -e
          mkdir -p dist
          cc -D_POSIX_C_SOURCE=200809L -std=c11 -O2 -Wall -Wextra -Wpedantic -fPIC -shared -I. -o dist/gs_log.so gs_log.c
          nm -D dist/gs_log.so | grep greenServeFE_module_init
          cp gs_log.c dist/gs_log.c
          zip -j dist/gs_log-linux-x86_64.zip dist/gs_log.so dist/gs_log.c
          sha256sum dist/gs_log.so > dist/gs_log.so.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gs_log-linux-x86_64
          path: dist/*
          if-no-files-found: error
