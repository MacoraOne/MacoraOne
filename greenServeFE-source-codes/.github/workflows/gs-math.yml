name: Build gs_math module
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p dist
          cc -D_POSIX_C_SOURCE=200809L -std=c11 -O2 -Wall -Wextra -Wpedantic -fPIC -shared -I. -o dist/gs_math.so gs_math.c -lm
          nm -D dist/gs_math.so | grep greenServeFE_module_init
          cp gs_math.c dist/gs_math.c
          zip -j dist/gs_math-linux-x86_64.zip dist/gs_math.so dist/gs_math.c
          sha256sum dist/gs_math.so > dist/gs_math.so.sha256
          sha256sum dist/gs_math-linux-x86_64.zip > dist/gs_math-linux-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gs_math-linux-x86_64
          path: dist/*
