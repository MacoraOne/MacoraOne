name: Build gs_hash module
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          set -e
          mkdir -p dist
          cc -D_POSIX_C_SOURCE=200809L -std=c11 -O2 -Wall -Wextra -Wpedantic -fPIC -shared -I. -o dist/gs_hash.so gs_hash.c
          nm -D dist/gs_hash.so | grep greenServeFE_module_init
          cp gs_hash.c dist/gs_hash.c
          zip -j dist/gs_hash-linux-x86_64.zip dist/gs_hash.so dist/gs_hash.c
          sha256sum dist/gs_hash.so > dist/gs_hash.so.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gs_hash-linux-x86_64
          path: dist/*
